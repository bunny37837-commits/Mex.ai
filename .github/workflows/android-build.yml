name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_ARGS: --console=plain --stacktrace --warning-mode all

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare diagnostics directories
        run: mkdir -p ci-logs diagnostics

      - name: Run lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew lint $GRADLE_ARGS 2>&1 | tee ci-logs/lint.log
          exit ${PIPESTATUS[0]}

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest $GRADLE_ARGS 2>&1 | tee ci-logs/unit-tests.log
          exit ${PIPESTATUS[0]}

      - name: Assemble debug APK
        id: assemble_debug
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug $GRADLE_ARGS 2>&1 | tee ci-logs/assemble-debug.log
          exit ${PIPESTATUS[0]}

      - name: Extract first real source-level error
        if: always()
        shell: bash
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble_debug.outcome }}
        run: |
          python3 <<'PY'
          import os, re, pathlib

          logs = [
              ("lint", "ci-logs/lint.log"),
              ("unit_tests", "ci-logs/unit-tests.log"),
              ("assemble_debug", "ci-logs/assemble-debug.log"),
          ]

          ignore_fragments = [
              "GradleCompilerRunnerWithWorkers.kt",
              "TaskExecutionException",
              "org.gradle.",
              "java.base/",
              "sun.reflect",
              "org.jetbrains.kotlin.compilerRunner",
              "org.gradle.internal",
              "org.gradle.api.tasks",
              "BuildExceptionReporter",
          ]

          def normalize_path(path: str) -> str:
              path = path.strip()
              path = path.replace('file://', '')
              path = path.replace('file:', '')
              path = path.replace('\\', '/')
              marker = '/app/src/'
              idx = path.find(marker)
              if idx != -1:
                  return 'app/src/' + path[idx + len(marker):].lstrip('/')
              idx2 = path.find('app/src/')
              if idx2 != -1:
                  return path[idx2:]
              return path

          task = "Unknown"
          file_path = "Unknown"
          line_no = "?"
          exact_error = "No source-level compiler error found. Check full logs."
          cause = "unknown"
          source_log = "Unknown"
          matched_lines = []

          task_patterns = [
              re.compile(r"> Task (:[^\s]+) FAILED"),
              re.compile(r"Execution failed for task '([^']+)'")
          ]

          source_patterns = [
              re.compile(r"^e:\s+file:///.+?/(app/src/main/java/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^e:\s+file:///.+?/(app/src/main/res/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^e:\s+/.+?/(app/src/main/java/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^e:\s+/.+?/(app/src/main/res/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^e:\s+(app/src/main/java/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^e:\s+(app/src/main/res/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^(app/src/main/java/[^:]+):(\d+):\s*error:\s*(.+)$"),
              re.compile(r"^(app/src/main/res/[^:]+):\s*error:\s*(.+)$"),
              re.compile(r"^error:\s+file:///.+?/(app/src/main/java/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^error:\s+/.+?/(app/src/main/java/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^error:\s+(app/src/main/java/[^:]+):(\d+):(\d+)\s+(.+)$"),
              re.compile(r"^error:\s+(app/src/main/res/[^:]+)\s*:\s*(.+)$"),
          ]

          combined_texts = []

          for log_name, log_path in logs:
              if not os.path.exists(log_path):
                  continue
              with open(log_path, "r", encoding="utf-8", errors="ignore") as f:
                  text = f.read()
              combined_texts.append((log_name, text))

              for pattern in task_patterns:
                  matches = pattern.findall(text)
                  if matches:
                      task = matches[-1]

              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if not line:
                      continue
                  if any(fragment in line for fragment in ignore_fragments):
                      continue

                  for pattern in source_patterns:
                      m = pattern.match(line)
                      if not m:
                          continue

                      groups = m.groups()
                      # patterns with file, line, col, message
                      if len(groups) == 4:
                          found_file, found_line, _found_col, found_error = groups
                      # patterns with file, line, message
                      elif len(groups) == 3:
                          found_file, found_line, found_error = groups
                      # patterns with file, message
                      elif len(groups) == 2:
                          found_file, found_error = groups
                          found_line = "?"
                      else:
                          continue

                      normalized = normalize_path(found_file)
                      compact_line = f"{normalized}:{found_line}: {found_error.strip()}"
                      matched_lines.append(compact_line)

                      if source_log == "Unknown":
                          file_path = normalized
                          line_no = found_line
                          exact_error = found_error.strip()
                          source_log = log_name
                      break

              if source_log != "Unknown":
                  # keep scanning remaining lines for a few more matched compiler lines in same log
                  for raw_line in text.splitlines():
                      line = raw_line.strip()
                      if any(fragment in line for fragment in ignore_fragments):
                          continue
                      for pattern in source_patterns:
                          m = pattern.match(line)
                          if not m:
                              continue
                          groups = m.groups()
                          if len(groups) == 4:
                              found_file, found_line, _found_col, found_error = groups
                          elif len(groups) == 3:
                              found_file, found_line, found_error = groups
                          elif len(groups) == 2:
                              found_file, found_error = groups
                              found_line = "?"
                          else:
                              continue
                          normalized = normalize_path(found_file)
                          compact_line = f"{normalized}:{found_line}: {found_error.strip()}"
                          if compact_line not in matched_lines:
                              matched_lines.append(compact_line)
                          if len(matched_lines) >= 5:
                              break
                      if len(matched_lines) >= 5:
                          break
                  break

          all_text = "\n\n".join(text for _, text in combined_texts).lower()
          lower_error = exact_error.lower()
          if "manifest" in all_text or "androidmanifest.xml" in lower_error or "/res/" in file_path:
              cause = "manifest/resources"
          elif "unresolved reference" in lower_error or "no parameter with name" in lower_error or "cannot find a parameter" in lower_error or "type mismatch" in lower_error:
              cause = "kotlin/compose"
          elif "@composable" in all_text or "composable" in lower_error or "material3" in all_text or "compose" in all_text:
              cause = "compose"
          elif "could not resolve" in all_text or "dependency" in all_text:
              cause = "dependency"
          elif "sdk location not found" in all_text:
              cause = "android sdk / environment"
          elif file_path.endswith('.kt'):
              cause = "kotlin"

          pathlib.Path("ci-logs").mkdir(parents=True, exist_ok=True)
          with open("ci-logs/first-real-error.txt", "w", encoding="utf-8") as f:
              f.write(f"Failing task: {task}\n")
              f.write(f"Exact file: {file_path}\n")
              f.write(f"Line number: {line_no}\n")
              f.write(f"Compiler error message: {exact_error}\n")
              f.write(f"Likely category: {cause}\n")
              f.write("First 5 matched compiler error lines:\n")
              for item in matched_lines[:5]:
                  f.write(f"- {item}\n")

          if file_path != "Unknown":
              safe_message = exact_error.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error file={file_path},line={line_no},title=Android CI source error::{safe_message}")

          summary = []
          summary.append("## Android CI First Real Error")
          summary.append("")
          summary.append(f"- Lint: {os.environ.get('LINT_OUTCOME', 'unknown')}")
          summary.append(f"- Unit tests: {os.environ.get('TEST_OUTCOME', 'unknown')}")
          summary.append(f"- Assemble debug: {os.environ.get('ASSEMBLE_OUTCOME', 'unknown')}")
          summary.append("")
          summary.append(f"- Failing task: `{task}`")
          summary.append(f"- Exact normalized file path: `{file_path}`")
          summary.append(f"- Line number: `{line_no}`")
          summary.append(f"- Likely category: `{cause}`")
          summary.append("")
          summary.append("### Exact compiler error")
          summary.append(exact_error)
          summary.append("")
          summary.append("### First 5 matched compiler error lines")
          if matched_lines:
              for item in matched_lines[:5]:
                  summary.append(f"- `{item}`")
          else:
              summary.append("- No source-level compiler lines matched. Check `ci-logs/assemble-debug.log`.")
          summary.append("")
          summary.append("### Main debugging output")
          summary.append("- `ci-logs/first-real-error.txt`")
          summary.append("- `ci-logs/assemble-debug.log`")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          PY

      - name: Upload first real error artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-real-error
          path: ci-logs/first-real-error.txt
          if-no-files-found: warn

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: |
            ci-logs/**
          if-no-files-found: warn

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*.*
            app/build/reports/lint*/**
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: warn

      - name: Upload build reports and scans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-and-scans
          path: |
            build/reports/**
            .gradle/build-scan-data/**
          if-no-files-found: warn

      - name: Fail workflow if any stage failed
        if: steps.lint.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.assemble_debug.outcome != 'success'
        run: |
          echo "One or more Android CI stages failed. See first-real-error.txt, job summary, and uploaded artifacts."
          exit 1
